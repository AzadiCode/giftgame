services:
  - type: web
    name: xz-gift-miniapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 90
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: xzgift
      - key: ADMIN_IDS
        sync: false
      - key: STARTING_BALANCE
        value: "1000"
